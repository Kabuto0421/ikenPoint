<title>ぜろひゃく ずんだもん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 9:16 game screen centered on a dark edamame-field surround, credit line underneath. */
:root {
  --surround: #1c2617;
  --surround-ink: #b9d6a2;
  --frame: #2b3326;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--surround);
  color: var(--surround-ink);
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  display: block;
  touch-action: none;
  border-radius: 14px;
  box-shadow: 0 0 0 3px var(--frame), 0 18px 40px rgba(0, 0, 0, .45);
  outline: none;
}
canvas:focus-visible { box-shadow: 0 0 0 3px #ffd84a, 0 18px 40px rgba(0, 0, 0, .45); }
.credit {
  margin: 0;
  text-align: center;
  font: 11px/1.4 "KabutoTegaki", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  opacity: .75;
}
</style>

<div class="stage" id="stage">
  <canvas id="game" tabindex="0" aria-label="ぜろひゃく ずんだもん。おしているあいだ100、はなすと0。スペースキーでもあそべます。"></canvas>
</div>
<p class="credit">ずんだもん は 東北ずん子・ずんだもんプロジェクト の キャラクターです</p>

<script>
(() => {
'use strict';

// ============================================================
//  きほん
// ============================================================
const W = 360, H = 640;          // ろんり がめん
const SW = 120, SH = 100, SY = 88; // ドットえ シーン (x3 で ひょうじ)
const PS = 3;
const FF = "'KabutoTegaki', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif";
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  bg: '#eaf6d9', ink: '#2b3326', sub: '#5d6b52', panel: '#fffdf2',
  zunda: '#7cc84a', zundaD: '#4f9a3a', hot: '#ff6a3d', hotD: '#c9441f',
  cool: '#5aa9ff', coolD: '#2f6fbf', zone: '#a6e36b', zoneD: '#6cbf3f', gold: '#ffcf3a',
};

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const sc = document.createElement('canvas');
sc.width = SW; sc.height = SH;
const g = sc.getContext('2d');
g.imageSmoothingEnabled = false;
let scale = 1;

function resize() {
  const box = document.getElementById('stage').getBoundingClientRect();
  const cw = Math.max(200, Math.min(box.width, box.height * W / H));
  const ch = cw * H / W;
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  scale = cv.width / W;
}
window.addEventListener('resize', resize);

// ============================================================
//  いろ ユーティリティ
// ============================================================
const hexCache = {};
function hex(c) {
  return hexCache[c] || (hexCache[c] = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)));
}
function mix(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ============================================================
//  ドットえ
// ============================================================
const PAL = {
  k: '#2b3326', g: '#a6e07a', G: '#d6f7ad', d: '#74b84c', e: '#5fb646', E: '#b4ee8f',
  s: '#ffe8d6', S: '#f4c7aa', w: '#ffffff', W: '#d8e5dc', c: '#6cc457', C: '#3f8f37',
  o: '#e98b2e', p: '#ffa3b5', m: '#d24a62', b: '#3c6a31', u: '#5aa9ff', U: '#c4e4ff',
  r: '#ff6450', y: '#ffd84a', n: '#f1dc94', N: '#fff3c4', h: '#ffb08a', H: '#ffd5bd',
  i: '#c9dcff', I: '#eaf1ff', x: '#7a828a', X: '#4a5057', t: '#b77a4a', T: '#8c5a33',
};

function makeSprite(rows) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, j) => {
    for (let i = 0; i < r.length; i++) {
      const col = PAL[r[i]];
      if (!col) continue;
      x.fillStyle = col;
      x.fillRect(i, j, 1, 1);
    }
  });
  return c;
}
const mir = h => h + h.split('').reverse().join('');

// --- ずんだもん (24 x 33)  ひだりはんぶん を かいて ミラー ---
const Z_TOP = [
  '..kk........',
  '.kEek.......',
  '.keEek......',
  '..keEek.....',
  '..kkeEek....',
  '....kkeekkkk',
  '....kgggggGG',
  '...kggggggGG',
  '..kgggggggGg',
  '..kggggggggg',
  '.kgggggggggg',
  '.kggggdggggg',
  '.kgggdsggdgs',
  '.kggdsssdsss',
  '.kgdssssssss',
  '.kgdssssssss',
  '.kgdssssssss',
  '.kgdssssssss',
  '.kggdsssssss',
  '.kgggdkkkkkk',
  '.kggk....kss',
  '.kgk..kccccc',
  '..kk.kkcwwcc',
  '...kwwkcwwww',
  '...kwwkwwwww',
  '...kwwkwwwww',
  '...ksskccccc',
  '....kkkccccc',
  '......kcccck',
].map(mir);
const Z_LEGS_B = [
  '.......kssk..kssk.......',
  '.......kwwk.kbbbk.......',
  '......kbbbk.kkkkk.......',
  '......kkkkk.............',
];
const Z_LEGS = {
  stand: ['.......kssk.', '.......kwwk.', '......kbbbk.', '......kkkkk.'].map(mir),
  walkB: Z_LEGS_B,
  walkA: Z_LEGS_B.map(r => r.split('').reverse().join('')),
};
// め は 3x3、ひだり (6,14) / みぎ (15,14)
const Z_FACES = {
  normal: [[6, 14, ['kkk', 'kWo', 'koo']], [15, 14, ['kkk', 'oWk', 'ook']], [11, 18, ['mm']]],
  power:  [[6, 14, ['kk.', '.kk', 'kk.']], [15, 14, ['.kk', 'kk.', '.kk']], [10, 17, ['kkkk', 'kmmk']]],
  zero:   [[6, 15, ['kkk']], [15, 15, ['kkk']], [11, 18, ['kk']]],
  happy:  [[6, 14, ['.k.', 'k.k']], [15, 14, ['.k.', 'k.k']], [10, 17, ['kmmk', '.mm.']]],
  sad:    [[6, 15, ['kkk', '.u.', '.u.']], [15, 15, ['kkk', '.u.', '.u.']], [10, 17, ['.kk.', 'k..k']]],
  shock:  [[6, 14, ['kkk', 'kWk', 'kkk']], [15, 14, ['kkk', 'kWk', 'kkk']], [11, 17, ['kk', 'mm']]],
};
const zCache = {};
function zsp(face, legs) {
  const key = face + '|' + legs;
  if (zCache[key]) return zCache[key];
  const grid = Z_TOP.concat(Z_LEGS[legs]).map(r => r.split(''));
  const ovs = Z_FACES[face].concat([[5, 17, ['pp']], [17, 17, ['pp']]]);
  for (const [ox, oy, rows] of ovs) {
    rows.forEach((r, j) => {
      for (let i = 0; i < r.length; i++) if (r[i] !== '.') grid[oy + j][ox + i] = r[i];
    });
  }
  return (zCache[key] = makeSprite(grid.map(r => r.join(''))));
}

// --- まめ (だいずの ともだち 16 x 14) ---
const MAME_BASE = [
  '.....kkkkkk.....',
  '...kkNNNNNNkk...',
  '..kNNnnnnnnnNk..',
  '.kNnnnnnnnnnnnk.',
  '.kNnnnnnnnnnnnk.',
  'kNnnnkknnkknnnnk',
  'knnnnkknnkknnnnk',
  'knnnnnnnnnnnnnnk',
  'knnppnnkknnppnnk',
  'knnnnnnnnnnnnnnk',
  '.knnnnnnnnnnnnk.',
  '..kknnnnnnnnkk..',
  '....kkkkkkkk....',
  '....kk....kk....',
];
function mameVariant(eyes, body, hiCol) {
  const rows = MAME_BASE.map(r => r.split(''));
  if (eyes === 'happy') {
    rows[5] = 'kNnnnknnnnknnnnk'.split('');
    rows[6] = 'knnnknknnknknnnk'.split('');
  } else if (eyes === 'dizzy') {
    rows[5] = 'kNnnknknnknknnnk'.split('');
    rows[6] = 'knnnnknnnnknnnnk'.split('');
    rows[7] = 'knnnknknnknknnnk'.split('');
  } else if (eyes === 'tight') {
    rows[5] = 'kNnnnnnnnnnnnnnk'.split('');
    rows[6] = 'knnnkkknnkkknnnk'.split('');
  }
  return makeSprite(rows.map(r => r.join('').replace(/n/g, body).replace(/N/g, hiCol)));
}
const MAME = {
  normal: mameVariant('normal', 'n', 'N'),
  happy: mameVariant('happy', 'n', 'N'),
  hot: mameVariant('tight', 'h', 'H'),
  cold: mameVariant('tight', 'i', 'I'),
  dizzy: mameVariant('dizzy', 'n', 'N'),
};

// --- じょうろ / うちわ ---
const CAN = makeSprite([
  '...kkkkk......',
  '..k.....k.....',
  '.kkkkkkkkk..kk',
  '.kuUuuuuuk.kuk',
  '.kuUuuuuukkuk.',
  '.kuuuuuuuuuk..',
  '.kuuuuuuuk....',
  '.kuuuuuuuk....',
  '..kkkkkkk.....',
]);
const FAN = makeSprite([
  '..kkkk..',
  '.kwwwwk.',
  'kwrrwwwk',
  'kwrrwwwk',
  'kwwwwwwk',
  '.kwwwwk.',
  '..kkkk..',
  '...kk...',
  '...kt...',
  '...kt...',
  '...kk...',
]);

// --- ちいさな ピクセル ヘルパー ---
function px(c, x, y, w = 1, h = 1) { g.fillStyle = c; g.fillRect(Math.floor(x), Math.floor(y), w, h); }
function sky(top, bottom, horizon) {
  const bands = 6;
  for (let b = 0; b < bands; b++) {
    const y0 = Math.floor(horizon * b / bands), y1 = Math.floor(horizon * (b + 1) / bands);
    px(mix(top, bottom, b / (bands - 1)), 0, y0, SW, y1 - y0);
  }
}
function cloud(x, y, c = '#ffffff') {
  px(c, x + 3, y, 7, 2); px(c, x + 1, y + 2, 13, 2); px(c, x, y + 4, 16, 2);
}
function sparkle(x, y, t, c = '#ffd84a') {
  const f = Math.floor(t * 6) % 3;
  if (f === 0) { px(c, x, y); }
  else if (f === 1) { px(c, x - 1, y); px(c, x + 1, y); px(c, x, y - 1); px(c, x, y + 1); px('#ffffff', x, y); }
  else { px(c, x - 2, y); px(c, x + 2, y); px(c, x, y - 2); px(c, x, y + 2); }
}

// ============================================================
//  サウンド (のほほん けい: マリンバ + ピチカート、メジャーキー、かわいた おと)
// ============================================================
let muted = false;
const AU = { ctx: null };
const MASTER_VOL = 1.1;
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

function buildAudio() {
  const a = new (window.AudioContext || window.webkitAudioContext)();
  AU.ctx = a;
  const comp = a.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3;
  comp.connect(a.destination);
  AU.master = a.createGain(); AU.master.gain.value = muted ? 0 : MASTER_VOL;
  AU.master.connect(comp);
  // ちいさな へやの ひびき (みじかく、うすく)
  const len = Math.floor(a.sampleRate * 0.5);
  const ir = a.createBuffer(2, len, a.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
  }
  AU.verb = a.createConvolver(); AU.verb.buffer = ir;
  const verbOut = a.createGain(); verbOut.gain.value = 0.18;
  AU.verb.connect(verbOut).connect(AU.master);
  AU.music = a.createGain(); AU.music.gain.value = 0.5;
  AU.music.connect(AU.master);
  const ms = a.createGain(); ms.gain.value = 0.5; AU.music.connect(ms).connect(AU.verb);
  AU.sfx = a.createGain(); AU.sfx.gain.value = 0.9;
  AU.sfx.connect(AU.master);
  const ss = a.createGain(); ss.gain.value = 0.3; AU.sfx.connect(ss).connect(AU.verb);
  const nb = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  AU.noiseBuf = nb;
  // おしっぱなし の みず / うちわ の おと
  const src = a.createBufferSource(); src.buffer = nb; src.loop = true;
  AU.holdBP = a.createBiquadFilter(); AU.holdBP.type = 'bandpass'; AU.holdBP.frequency.value = 2500; AU.holdBP.Q.value = 0.8;
  AU.holdGain = a.createGain(); AU.holdGain.gain.value = 0;
  src.connect(AU.holdBP).connect(AU.holdGain).connect(AU.sfx);
  src.start();
}

function ensureAudio() {
  try {
    if (!AU.ctx) buildAudio();
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
  } catch (e) { AU.ctx = null; }
}
function setMuted(m) {
  muted = m;
  if (AU.ctx) AU.master.gain.setTargetAtTime(muted ? 0 : MASTER_VOL, AU.ctx.currentTime, 0.05);
}
document.addEventListener('visibilitychange', () => {
  if (!AU.ctx) return;
  if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume();
});

// --- おとの ぶひん ---
function voice(o) {
  const a = AU.ctx; if (!a) return;
  const t = o.t != null ? o.t : a.currentTime;
  const osc = a.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.slide || o.dur));
  if (o.vib) {
    const l = a.createOscillator(), lg = a.createGain();
    l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
    l.connect(lg).connect(osc.frequency);
    l.start(t); l.stop(t + o.dur + 0.05);
  }
  const gn = a.createGain();
  const atk = o.attack != null ? o.attack : 0.004;
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.linearRampToValueAtTime(o.vol, t + atk);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  osc.connect(gn);
  let out = gn;
  if (o.lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; gn.connect(f); out = f; }
  out.connect(o.bus || AU.sfx);
  osc.start(t); osc.stop(t + o.dur + 0.05);
}
// マリンバ: ころん とした みじかい おと
function mari(n, t, vol, bus, dur = 0.32) {
  const f = mtof(n);
  voice({ f, t, dur, vol, bus, attack: 0.003 });
  voice({ f: f * 3.95, t, dur: dur * 0.16, vol: vol * 0.16, bus, attack: 0.002 });
}
// てっきん: きらっ
function glock(n, t, vol, bus) {
  const f = mtof(n);
  voice({ f, t, dur: 0.35, vol, bus, attack: 0.002 });
  voice({ f: f * 2.76, t, dur: 0.12, vol: vol * 0.2, bus, attack: 0.002 });
}
// ピチカート ベース
function pizz(n, t, vol, bus) {
  while (n < 38) n += 12;
  voice({ f: mtof(n), t, dur: 0.22, vol, bus, type: 'triangle', attack: 0.004, lp: 900 });
}
function noiseHit(t, vol, freq, dur, q = 1, bus) {
  const a = AU.ctx; if (!a) return;
  const s = a.createBufferSource(); s.buffer = AU.noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(bus || AU.sfx);
  s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const woodblock = (t, vol, bus, f = 880) => voice({ f, f2: f * 0.8, t, dur: 0.06, vol, bus, attack: 0.001 });

const now = () => AU.ctx ? AU.ctx.currentTime : 0;
const PENTA = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93];
const sfx = {
  // ぴゅいっ (100 に なる)
  press() { if (!AU.ctx) return; const t = now(); voice({ f: 520, f2: 1150, t, dur: 0.16, vol: 0.075, attack: 0.008, slide: 0.12 }); woodblock(t, 0.03, AU.sfx, 1200); },
  // ぽてっ (0 に もどる)
  release() { if (!AU.ctx) return; const t = now(); voice({ f: 620, f2: 300, t, dur: 0.13, vol: 0.07, attack: 0.003, slide: 0.1 }); },
  // ちょうどいい あいだの ころん (しんちょくで おとが あがる)
  tick(p) { if (!AU.ctx) return; mari(PENTA[Math.min(PENTA.length - 1, Math.floor(p * PENTA.length))] + 12, now(), 0.035, AU.sfx, 0.25); },
  // ぼよよん! (マンガの バネ)
  acc() { if (!AU.ctx) return; const t = now(); voice({ f: 220, f2: 520, t, dur: 0.5, vol: 0.09, vib: [17, 70], slide: 0.45 }); woodblock(t, 0.05, AU.sfx, 700); },
  count(hi) { if (!AU.ctx) return; const t = now(); if (hi) { [72, 76, 79, 84].forEach((n, i) => mari(n, t + i * 0.05, 0.06, AU.sfx, 0.45)); } else mari(79, t, 0.06, AU.sfx, 0.3); },
  // ちゃららら〜ん ちゃんちゃん♪
  clear() { if (!AU.ctx) return; const t = now(); [72, 76, 79, 84, 88].forEach((n, i) => mari(n, t + i * 0.07, 0.07)); [79, 84].forEach((n, i) => { mari(n, t + 0.55 + i * 0.16, 0.08, AU.sfx, 0.4); glock(n + 12, t + 0.55 + i * 0.16, 0.03); }); pizz(36, t + 0.55, 0.1); pizz(48, t + 0.71, 0.1); },
  // ぽぺぽぺ〜 (しっぱい: マンガの トロンボーン)
  fail() { if (!AU.ctx) return; const t = now(); [67, 66, 65].forEach((n, i) => voice({ f: mtof(n), t: t + i * 0.26, dur: 0.24, vol: 0.07, type: 'triangle', attack: 0.02, lp: 1400 })); voice({ f: mtof(64), f2: mtof(62), t: t + 0.78, dur: 0.75, vol: 0.075, type: 'triangle', attack: 0.02, lp: 1400, vib: [6, 7], slide: 0.7 }); },
  ui() { if (!AU.ctx) return; mari(84, now(), 0.05, AU.sfx, 0.2); },
  step() { if (!AU.ctx) return; woodblock(now(), 0.022, AU.sfx, rnd(560, 680)); },
};

// --- BGM (シーケンサー、8ぶおんぷ たんい) ---
const C_ = [60, 64, 67], F_ = [60, 65, 69], G_ = [59, 62, 67], Am = [60, 64, 69];
const TRACKS = {
  title: {
    swing: 0.12,
    chords: [C_, Am, F_, G_], bass: [36, 33, 41, 43],
    mel: [
      72, 0, 76, 0, 79, 0, 76, 0,   77, 76, 74, 0, 72, 0, 0, 0,
      69, 0, 72, 0, 77, 0, 76, 74,  74, 0, 79, 0, 0, 0, 0, 0,
      76, 0, 79, 0, 84, 0, 79, 0,   81, 0, 79, 76, 72, 0, 0, 0,
      77, 0, 76, 0, 74, 0, 72, 0,   74, 0, 71, 0, 72, 0, 0, 0,
    ],
  },
  play: {
    swing: 0.1,
    chords: [C_, F_, G_, C_, Am, F_, G_, G_], bass: [36, 41, 43, 36, 33, 41, 43, 43],
    mel: [
      72, 0, 72, 74, 76, 0, 72, 0,  77, 0, 76, 0, 74, 0, 72, 0,
      74, 0, 74, 76, 79, 0, 74, 0,  76, 0, 72, 0, 72, 0, 0, 0,
      76, 0, 76, 77, 79, 0, 76, 0,  81, 0, 79, 0, 77, 0, 76, 0,
      74, 0, 76, 0, 79, 0, 83, 0,   86, 0, 0, 0, 79, 0, 0, 0,
    ],
  },
};
// ステージごとに キー と テンポ (みずやり: C / おふろ: ひくめの F で のんびり / おさんぽ: D で かるく)
const STAGE_MUSIC = [{ tp: 0, bpm: 120 }, { tp: -7, bpm: 104 }, { tp: 2, bpm: 132 }];
const MUSIC = { key: null, tr: null, tp: 0, bpm: 110, step: 0, nextT: 0 };

function wantedMusic() {
  if (mode === 'title' || mode === 'final' || mode === 'loading') return { key: mode === 'final' ? 'final' : 'title', tr: TRACKS.title, tp: mode === 'final' ? 5 : 0, bpm: 112 };
  const sm = STAGE_MUSIC[stageIdx] || STAGE_MUSIC[0];
  return { key: 'play' + stageIdx, tr: TRACKS.play, tp: sm.tp, bpm: sm.bpm };
}

function musicTick() {
  const a = AU.ctx;
  if (!a || a.state !== 'running') return;
  const w = wantedMusic();
  if (w.key !== MUSIC.key) {
    Object.assign(MUSIC, w, { step: 0, nextT: a.currentTime + 0.15 });
    AU.music.gain.cancelScheduledValues(a.currentTime);
    AU.music.gain.setValueAtTime(0.0001, a.currentTime);
    AU.music.gain.linearRampToValueAtTime(0.5, a.currentTime + 0.4);
  }
  if (MUSIC.nextT < a.currentTime - 0.5) MUSIC.nextT = a.currentTime + 0.05;
  const spb = 60 / MUSIC.bpm / 2;
  while (MUSIC.nextT < a.currentTime + 0.3) {
    const st = MUSIC.step;
    playStep(st, MUSIC.nextT + (st % 2 ? spb * MUSIC.tr.swing : 0));
    MUSIC.nextT += spb;
    MUSIC.step = (st + 1) % MUSIC.tr.mel.length;
  }
}

function playStep(step, t) {
  const tr = MUSIC.tr, tp = MUSIC.tp, B = AU.music;
  const bar = Math.floor(step / 8), pos = step % 8;
  const chord = tr.chords[bar % tr.chords.length].map(n => n + tp);
  const root = tr.bass[bar % tr.bass.length] + tp;
  // ずん・ちゃっ・ずん・ちゃっ
  if (pos === 0) pizz(root, t, 0.11, B);
  if (pos === 4) pizz(root + 7, t, 0.09, B);
  if (pos === 2 || pos === 6) chord.forEach(n => mari(n, t, 0.022, B, 0.18));
  const m = tr.mel[step];
  if (m) mari(m + tp, t, 0.07, B, 0.34);
  const playing = mode === 'play' && S;
  if (playing) {
    if (pos % 2 === 1) noiseHit(t, 0.012, 7500, 0.04, 1.5, B);       // しゃかしゃか
    if (pos === 2 || pos === 6) woodblock(t, 0.018, B, 1000);           // ぽこ
    if (S.P) {                                                           // 100 の ときは にぎやかに
      if (m) glock(m + tp + 12, t, 0.025, B);
      if (pos === 0 || pos === 4) voice({ f: 120, f2: 55, t, dur: 0.12, vol: 0.06, attack: 0.002, bus: B });
      if (pos % 2 === 0) noiseHit(t, 0.01, 9000, 0.03, 1.5, B);
    }
  } else if (bar % 2 === 1 && pos === 7) glock(chord[2] + 12, t, 0.018, B);
}
setInterval(musicTick, 60);

// まいフレーム: おしっぱなしの みず / うちわ の おと
function updateAudio(st, s) {
  const a = AU.ctx; if (!a) return;
  const t = a.currentTime;
  let hv = 0;
  if (mode === 'play' && s && s.P) {
    if (st.key === 'water') { hv = 0.035; AU.holdBP.frequency.setTargetAtTime(2600, t, 0.05); AU.holdBP.Q.setTargetAtTime(0.8, t, 0.05); }
    else if (st.key === 'bath') { hv = 0.03; AU.holdBP.frequency.setTargetAtTime(1200 + 500 * Math.sin(globalT * 40), t, 0.01); AU.holdBP.Q.setTargetAtTime(1.0, t, 0.05); }
  }
  AU.holdGain.gain.setTargetAtTime(hv, t, hv ? 0.04 : 0.08);
}

//  ゲームの じょうたい
// ============================================================
let mode = 'loading';   // loading / title / intro / countdown / play / stageEnd / final
let modeT = 0;          // いまの モードに なってからの じかん
let stageIdx = 0;
let S = null;           // ステージの じょうたい
let results = [];
let best = 0;
let fontReady = false;
let shake = 0;
let fx = null;          // おおきな もじ エフェクト
let bubble = null;      // ふきだし
let particles = [];
let signPop = 0;
let lastP = 0;
let globalT = 0;
try { best = parseInt(localStorage.getItem('zerohyaku-best') || '0', 10) || 0; } catch (e) { best = 0; }

function newStageState() {
  const st = STAGES[stageIdx];
  const s = { t: 0, v: 50, progress: 0, stun: 0, accCD: 0, acc: 0, inZoneT: 0, zoneSaid: false, tickT: 0, dizzy: 0, lastAccSide: null, sadT: 0 };
  st.init(s);
  particles = [];
  bubble = null; fx = null;
  return s;
}

function setMode(m) { mode = m; modeT = 0; }

function say(text, dur = 1.5, prio = 0) {
  if (bubble && bubble.prio > prio && bubble.t < bubble.dur) return;
  bubble = { text, t: 0, dur, prio };
}

// ============================================================
//  にゅうりょく
// ============================================================
const held = new Set();
let keyHeld = false;
const isHolding = () => held.size > 0 || keyHeld;

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const MUTE_BOX = { x: 284, y: 8, w: 66, h: 26 };
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.focus({ preventScroll: true });
  ensureAudio();
  const p = toLogical(e);
  if (mode !== 'loading' && inBox(p, MUTE_BOX)) { setMuted(!muted); sfx.ui(); return; }
  held.add(e.pointerId);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
function endPointer(e) {
  if (held.delete(e.pointerId)) onTap();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => held.delete(e.pointerId));
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    keyHeld = true;
  } else if (e.code === 'KeyM') { ensureAudio(); setMuted(!muted); }
});
window.addEventListener('keyup', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && keyHeld) { keyHeld = false; onTap(); }
});
window.addEventListener('blur', () => { held.clear(); keyHeld = false; });

// タップ (はなした しゅんかん) で がめんを すすめる
function onTap() {
  if (modeT < 0.35) return;
  if (mode === 'title') { stageIdx = 0; results = []; S = newStageState(); setMode('intro'); sfx.ui(); }
  else if (mode === 'intro') { setMode('countdown'); }
  else if (mode === 'stageEnd') {
    if (stageIdx < STAGES.length - 1) { stageIdx++; S = newStageState(); setMode('intro'); sfx.ui(); }
    else { finishRun(); }
  }
  else if (mode === 'final') { setMode('title'); sfx.ui(); }
}

function finishRun() {
  const total = results.reduce((a, r) => a + r.score, 0);
  const isBest = total > best;
  if (isBest) { best = total; try { localStorage.setItem('zerohyaku-best', String(best)); } catch (e) {} }
  results.total = total; results.isBest = isBest;
  setMode('final');
  if (rankOf(total).key === 'S' || rankOf(total).key === 'A') sfx.clear(); else sfx.ui();
}

];

// ============================================================
//  アップデート
// ============================================================
function update(dt) {
  globalT += dt;
  modeT += dt;
  shake = Math.max(0, shake - dt * 2.5);
  signPop = Math.max(0, signPop - dt * 4);
  if (bubble) { bubble.t += dt; if (bubble.t > bubble.dur) bubble = null; }
  if (fx) { fx.t += dt; if (fx.t > 1) fx = null; }

  if (mode === 'countdown') {
    const step = Math.floor(modeT / 0.7);
    if (step !== S.cdStep) { S.cdStep = step; if (step < 4) sfx.count(step === 3); }
    if (modeT >= 2.8) { setMode('play'); lastP = isHolding() ? 100 : 0; }
    updateParticles(dt);
    return;
  }
  if (mode === 'stageEnd' || mode === 'intro') { updateParticles(dt); idleAnim(dt); return; }
  if (mode !== 'play') return;

  const st = STAGES[stageIdx];
  const s = S;
  s.t += dt;
  s.stun = Math.max(0, s.stun - dt);
  s.accCD = Math.max(0, s.accCD - dt);
  s.dizzy = Math.max(0, s.dizzy - dt);
  s.sadT = Math.max(0, s.sadT - dt);

  const P = (isHolding() && s.stun <= 0) ? 100 : 0;
  if (P !== lastP) {
    signPop = 1;
    if (P) { sfx.press(); if (!bubble || bubble.t > 0.9) say(pick(LINES.press), 1.2); }
    else { sfx.release(); if (!bubble || bubble.t > 0.9) say(pick(LINES.release), 1.2); }
    lastP = P;
  }
  s.P = P;
  st.update(s, P, dt);

  if (s.v >= 100) { s.v = 100; accident('hi'); }
  if (s.v <= 0) { s.v = 0; accident('lo'); }
  s.v = clamp(s.v, 0, 100);

  const z = st.zone(s.t);
  s.zone = z;
  const inZone = Math.abs(s.v - z.c) <= z.h;
  s.inZone = inZone;
  if (inZone) {
    s.progress = Math.min(1, s.progress + dt / st.need);
    s.inZoneT += dt;
    s.tickT -= dt;
    if (s.tickT <= 0) { sfx.tick(s.progress); s.tickT = 0.42; }
    if (s.inZoneT > 1.6 && !s.zoneSaid) { s.zoneSaid = true; say(pick(LINES.zone), 1.6, 1); }
  } else { s.inZoneT = 0; s.zoneSaid = false; s.tickT = 0; }

  stageParticles(st, s, dt);
  updateParticles(dt);

  if (s.progress >= 1) endStage(true);
  else if (s.t >= st.limit) endStage(false);
}

function accident(side) {
  const st = STAGES[stageIdx], s = S;
  if (s.accCD > 0) return;
  s.accCD = 1.6;
  s.acc++;
  s.progress = Math.max(0, s.progress - 0.05);
  s.lastAccSide = side;
  s.sadT = 1.2;
  say(side === 'hi' ? st.hiMsg : st.loMsg, 1.8, 2);
  fx = { text: side === 'hi' ? st.hiFx : st.loFx, t: 0, hot: (side === st.pushSide) };
  if (!REDUCED) shake = side === st.pushSide ? 1 : 0.5;
  sfx.acc();
  if (side === st.pushSide) s.stun = 1.0;
  st.onAcc && st.onAcc(s, side);
}

function endStage(clear) {
  const st = STAGES[stageIdx], s = S;
  const remain = Math.max(0, st.limit - s.t);
  const score = clear ? Math.max(300, 1000 + Math.floor(remain * 50) - s.acc * 50) : Math.floor(s.progress * 600);
  results[stageIdx] = { clear, remain, acc: s.acc, progress: s.progress, score };
  s.P = 0; lastP = 0;
  bubble = null;
  say(clear ? pick(['できたのだ！ ちょうどよかったのだ！', 'やったのだ〜！', 'ぼく、てんさい かもなのだ！']) : pick(['うまく いかなかったのだ…', 'ちょうどいい は とおいのだ…']), 3, 3);
  if (clear) { sfx.clear(); for (let i = 0; i < 24; i++) particles.push({ x: rnd(10, 110), y: rnd(-10, 10), vx: rnd(-8, 8), vy: rnd(10, 30), g: 20, life: rnd(1.5, 3), c: pick(['#ffd84a', '#ff9db0', '#7cc84a', '#5aa9ff', '#ffffff']), conf: true }); }
  else sfx.fail();
  setMode('stageEnd');
}

function idleAnim(dt) {
  if (!S) return;
  const st = STAGES[stageIdx];
  if (st.key === 'walk') {
    S.cam += 12 * dt; S.fph += 12 * dt * 0.12;
  }
}

// ============================================================
//  パーティクル
// ============================================================
function updateParticles(dt) {
  for (const p of particles) {
    p.vy += (p.g || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.ground && p.y >= p.ground) {
      p.life = 0;
      if (p.splash) for (let i = 0; i < 2; i++) particles.push({ x: p.x, y: p.ground - 1, vx: rnd(-14, 14), vy: rnd(-26, -10), g: 120, life: 0.3, c: '#c4e4ff' });
    }
  }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}

function stageParticles(st, s, dt) {
  if (st.key === 'water') {
    if (s.P) {
      const tip = canTip(true);
      for (let i = 0; i < 5; i++) particles.push({ x: tip.x + rnd(-1, 1), y: tip.y + rnd(-1, 1), vx: rnd(40, 66), vy: rnd(-10, 8), g: 130, life: 2, c: pick(['#5aa9ff', '#5aa9ff', '#c4e4ff']), ground: 87, splash: Math.random() < 0.3 });
    }
  } else if (st.key === 'bath') {
    if (Math.random() < (0.1 + s.v / 100 * 1.2) * dt * 30) particles.push({ x: rnd(56, 104), y: 53, vx: rnd(-3, 3), vy: rnd(-14, -6), g: 0, life: rnd(0.8, 1.6), c: s.v > 70 ? '#ffffff' : '#eef3f7', steam: true });
    if (s.heat > 30 && Math.random() < s.heat / 100) particles.push({ x: rnd(66, 86), y: 82, vx: rnd(-4, 4), vy: rnd(-24, -12), g: 0, life: 0.4, c: pick(['#ffd84a', '#ff9a3d']) });
    if (s.P) particles.push({ x: rnd(36, 44), y: rnd(72, 84), vx: rnd(55, 75), vy: rnd(-3, 3), g: 0, life: 0.35, c: '#ffffff', wind: true });
  } else if (st.key === 'walk') {
    if (s.spd > 55 && Math.random() < 0.7) {
      const zx = zundaWalkX(s);
      particles.push({ x: zx + rnd(4, 10), y: 87, vx: rnd(-30, -14), vy: rnd(-10, -3), g: 20, life: 0.4, c: '#d9bf8a' });
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    if (p.steam) {
      const a = p.life;
      px(p.c, p.x + Math.sin((p.life + p.x) * 5), p.y, a > 0.6 ? 2 : 1, a > 0.6 ? 2 : 1);
    } else if (p.wind) {
      px(p.c, p.x, p.y, 3, 1);
    } else if (p.conf) {
      px(p.c, p.x, p.y, 2, 1);
    } else {
      px(p.c, p.x, p.y, 1, 1);
    }
  }
}

function drawZunda(x, y, face, legs, P, t) {
  let dx = 0, dy = 0;
  if (P) {
    dx = Math.floor(t * 28) % 2 ? 1 : 0;
    // やるき オーラ
    for (let i = 0; i < 14; i++) {
      const fl = Math.floor(t * 14 + i * 3);
      const ax = x - 3 + ((i * 37 + fl * 7) % 30);
      const hgt = 3 + ((i * 5 + fl) % 6);
      const ay = y + 8 + ((i * 11 + fl * 3) % 22);
      px(i % 3 ? '#ffb347' : '#ff6450', ax, ay - hgt, 1, hgt);
    }
  } else if (face === 'zero') dy = 1;
  g.drawImage(zsp(face, legs), Math.round(x + dx), Math.round(y + dy));
  if (face === 'zero' && !P) {
    // ぼーっ の せん
    const f = Math.floor(t * 2) % 2;
    px('#8a9a80', x + 25, y + 6 - f, 3, 1); px('#8a9a80', x + 27, y + 3 - f, 2, 1);
  }
}

function zundaFace(s) {
  if (!s) return 'normal';
  if (mode === 'stageEnd') { const r = results[stageIdx]; return r && r.clear ? 'happy' : 'sad'; }
  if (mode !== 'play') return 'normal';
  if (s.stun > 0) return 'shock';
  if (s.sadT > 0) return 'sad';
  if (s.P) return 'power';
  if (s.inZone) return 'happy';
  return 'zero';
}

function canTip(raised) {
  const hx = 28, hy = raised ? 70 : 81, a = raised ? 0.75 : 0;
  const lx = 13, ly = -4;
  return { x: hx + Math.cos(a) * lx - Math.sin(a) * ly, y: hy + Math.sin(a) * lx + Math.cos(a) * ly };
}

function sceneWater(s, t) {

}

function drawPlant(bx, by, v, t, happy) {
  const droop = v < 30 ? (30 - v) / 30 : 0;
  const drown = v > 85 ? (v - 85) / 15 : 0;
  const leaf = mix('#4fae3c', '#b3a14a', droop);
  const leafHi = mix('#8fdc66', '#d8c56c', droop);
  const stem = mix('#3f8a33', '#8c8a3a', droop);
  const hgt = 22 - Math.round(droop * 6);
  const bendAt = i => Math.round(droop * droop * 9 * (i / hgt) ** 2 + (drown ? Math.sin(t * 7 + i * 0.4) * drown * 1.2 : 0));
  for (let i = 0; i < hgt; i++) px(stem, bx + bendAt(i), by - i, 2, 1);
  const leaves = [[7, -1], [12, 1], [17, -1], [hgt, 0]];
  for (const [hh, side] of leaves) {
    const b = bendAt(Math.min(hh, hgt - 1));
    const lx = bx + b + (side < 0 ? -7 : side > 0 ? 2 : -3);
    const ly = by - hh + Math.round(droop * 3 * (side === 0 ? 2 : 1));
    px(leaf, lx + 1, ly - 1, 6, 1); px(leaf, lx, ly, 8, 2); px(leafHi, lx + 2, ly, 3, 1); px(leaf, lx + 2, ly + 2, 4, 1);
  }
  // さや
  const pod = mix('#6cc457', '#b0a050', droop);
  [[9, 3], [14, -4], [19, 3]].forEach(([hh, ox]) => {
    if (hh >= hgt) return;
    const x = bx + bendAt(hh) + ox, y = by - hh + 2;
    px(pod, x, y, 2, 5); px(mix(pod, '#ffffff', 0.35), x, y + 1, 1, 1); px(mix(pod, '#ffffff', 0.35), x, y + 3, 1, 1);
  });
  if (happy) { sparkle(bx - 10, by - 18, t); sparkle(bx + 12, by - 22, t + 0.2); sparkle(bx + 6, by - 8, t + 0.4); }
}

function sceneBath(s, t) {
  sky('#5b5a9e', '#ffb59a', 70);
  px('#fff3c4', 14, 8, 6, 6); px('#5b5a9e', 17, 8, 3, 3);
  for (let i = 0; i < 8; i++) px('#ffffff', (i * 41 + 7) % SW, (i * 17 + 3) % 30, 1, 1);
  // へい
  for (let x = 0; x < SW; x += 8) { px('#c08a5a', x, 46, 7, 44); px('#a8743f', x + 6, 46, 1, 44); px('#d9a374', x, 46, 7, 1); }
  px('#8c5a33', 0, 58, SW, 2);
  px('#9b8b74', 0, 90, SW, 10); px('#7f705d', 0, 90, SW, 1);
  // かまど
  const heat = mode === 'play' ? s.heat : (s.heat || 0);
  for (let y = 72; y < 90; y += 4) for (let x = 46 + ((y / 4) % 2) * 4; x < 112; x += 8) { px('#b5653f', x, y, 7, 3); px('#d58258', x, y, 7, 1); }
  px('#8a4a2c', 46, 72, 66, 1);
  px('#2a1a14', 62, 79, 26, 11);
  for (let i = 0; i < 8; i++) {
    const fl = (Math.sin(t * 18 + i * 1.7) + 1) / 2;
    const hh = Math.round(1 + heat / 100 * 8 * (0.6 + 0.4 * fl));
    const x = 63 + i * 3;
    px('#ff6450', x, 90 - hh, 3, hh);
    if (hh > 2) px('#ff9a3d', x, 90 - hh + 1, 2, hh - 1);
    if (hh > 4) px('#ffd84a', x + 1, 90 - hh + 3, 1, hh - 3);
  }
  // まめ in おふろ
  const mv = s.v;
  let mk = 'normal';
  if (mode === 'play' || mode === 'stageEnd') {
    if (mv > 72) mk = 'hot'; else if (mv < 30) mk = 'cold'; else if (s.inZone || (mode === 'stageEnd' && results[stageIdx] && results[stageIdx].clear)) mk = 'happy';
  }
  const shiver = mk === 'cold' ? (Math.floor(t * 20) % 2) : 0;
  const jump = (mode === 'play' && s.stun > 0) ? Math.round(Math.sin((1 - s.stun) * Math.PI) * 14) : 0;
  g.drawImage(MAME[mk], 72 + shiver, 42 - jump);
  if (mk === 'hot') { px('#5aa9ff', 70, 44, 1, 2); px('#5aa9ff', 89, 46, 1, 2); }
  if (mk === 'happy') { sparkle(68, 40, t); sparkle(92, 38, t + 0.3); }
  // おけ (なべ)
  const water = mix('#8fd0ff', '#ffc2a0', clamp((mv - 40) / 60, 0, 1));
  px('#5b636b', 50, 54, 60, 2);
  px(water, 52, 56, 56, 2);
  px('#3a3f45', 50, 58, 60, 14);
  px('#4a5057', 52, 59, 4, 10);
  px('#2b3036', 50, 71, 60, 1);
  drawParticles();
  // ずんだもん と うちわ
  const P = mode === 'play' ? s.P : 0;
  drawZunda(6, 57, zundaFace(s), 'stand', P, t);
  g.save();
  g.translate(25, 84);
  g.rotate(P ? 0.9 + Math.sin(t * 40) * 0.55 : 1.0);
  g.drawImage(FAN, -4, -12);
  g.restore();
}

function zundaWalkX(s) { return 90 - 22 - s.v * 0.55; }

function sceneWalk(s, t) {
  sky('#8fd0ff', '#e9f8ff', 60);
  const cam = s.cam || 0;
  cloud(((-cam * 0.05 + 20) % 170 + 170) % 170 - 30, 9); cloud(((-cam * 0.05 + 100) % 170 + 170) % 170 - 30, 20, '#f4fbff');
  for (let x = 0; x < SW; x++) {
    const wx = x + cam * 0.15;
    px('#b6dba0', x, 44 + Math.round(6 * Math.sin(wx * 0.05) + 3 * Math.sin(wx * 0.13)), 1, 30);
  }
  for (let x = 0; x < SW; x++) {
    const wx = x + cam * 0.35;
    px('#90cf6c', x, 58 + Math.round(4 * Math.sin(wx * 0.09)), 1, 30);
  }
  // き
  for (let i = -1; i < 4; i++) {
    const base = i * 44 - ((cam * 0.7) % 44);
    const tx = Math.round(base + 10);
    px('#8c5a33', tx + 3, 62, 3, 14);
    px('#4f9a3a', tx - 2, 50, 13, 10); px('#5fb646', tx, 46, 9, 6); px('#7cc84a', tx + 1, 48, 4, 3);
  }
  px('#7bbd52', 0, 74, SW, 26);
  px('#e3c48c', 0, 82, SW, 12); px('#cfae72', 0, 82, SW, 1);
  for (let i = -1; i < 14; i++) {
    const x = Math.round(i * 10 - (cam % 10));
    px('#c6a468', x, 86 + (i & 1) * 4, 2, 1);
  }
  for (let i = -1; i < 9; i++) {
    const x = Math.round(i * 16 - (cam * 1.0 % 16));
    px('#ff9db0', x + 4, 77, 1, 1); px('#ffffff', x + 11, 78, 1, 1);
  }
  // まめ
  const fbob = Math.floor(s.fph || 0) % 2;
  let mk = 'normal';
  if (s.dizzy > 0) mk = 'dizzy';
  else if (mode === 'play' && s.inZone) mk = 'happy';
  else if (mode === 'stageEnd') mk = results[stageIdx] && results[stageIdx].clear ? 'happy' : 'normal';
  g.drawImage(MAME[mk], 90, 74 - fbob);
  if (s.dizzy > 0) { sparkle(92, 70, t); sparkle(104, 69, t + 0.3); }
  // ずんだもん
  const zx = zundaWalkX(s);
  const spd = s.spd || 0;
  const legs = (spd < 6 && mode === 'play') ? 'stand' : (Math.floor(s.zph || (mode !== 'play' ? t * 3 : 0)) % 2 ? 'walkA' : 'walkB');
  const zbob = legs === 'stand' ? 0 : (legs === 'walkA' ? 0 : -1);
  const P = mode === 'play' ? s.P : 0;
  drawParticles();
  drawZunda(zx, 55 + zbob, zundaFace(s), legs, P, t);
  if (spd > 60) for (let i = 0; i < 3; i++) px('#ffffff', zx - 6 - ((Math.floor(t * 30) + i * 3) % 6), 64 + i * 6, 4, 1);
}

function drawScene() {
  const st = STAGES[stageIdx];
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, SW, SH);
  const t = globalT;
  if (st.key === 'water') sceneWater(S, t);
  else if (st.key === 'bath') sceneBath(S, t);
  else sceneWalk(S, t);
}

//  UI を かく (ろんり 360 x 640)

function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  rrPath(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function text(str, x, y, size, color, align = 'center', outline = null, ow = 5) {
  ctx.font = `${size}px ${FF}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = ow; ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `${size}px ${FF}`;
  const tokens = str.split(/(?<=[ 、。！？…」])/);
  const lines = [];
  let cur = '';
  for (let tk of tokens) {
    if (ctx.measureText(cur + tk).width <= maxW) { cur += tk; continue; }
    if (cur) { lines.push(cur.trim()); cur = ''; }
    while (ctx.measureText(tk).width > maxW) {
      let i = 1;
      while (i < tk.length && ctx.measureText(tk.slice(0, i + 1)).width <= maxW) i++;
      lines.push(tk.slice(0, i)); tk = tk.slice(i);
    }
    cur = tk;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

function drawBackdrop() {

}

function drawGauge(st, s) {
  const x = 28, y = 414, w = 304, h = 30;
  const z = s.zone || st.zone(s.t);
  rr(x - 5, y - 5, w + 10, h + 10, 12, C.ink);
  ctx.save();
  rrPath(x, y, w, h, 8); ctx.clip();
  const grd = ctx.createLinearGradient(x, 0, x + w, 0);
  const loC = st.key === 'walk' ? '#ffd0c4' : '#ffe9c7';
  const hiC = st.key === 'water' ? '#cfe6ff' : st.key === 'bath' ? '#ffd0c4' : '#dfe3ff';
  grd.addColorStop(0, loC); grd.addColorStop(0.5, '#fbfbef'); grd.addColorStop(1, hiC);
  ctx.fillStyle = grd; ctx.fillRect(x, y, w, h);
  const zx = x + (z.c - z.h) / 100 * w, zw = z.h * 2 / 100 * w;
  ctx.fillStyle = s.inZone ? '#8fdc5a' : C.zone;
  ctx.fillRect(zx, y, zw, h);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = -h; i < zw; i += 10) { ctx.beginPath(); ctx.moveTo(zx + i, y + h); ctx.lineTo(zx + i + 5, y + h); ctx.lineTo(zx + i + 5 + h, y); ctx.lineTo(zx + i + h, y); ctx.fill(); }
  ctx.strokeStyle = C.zoneD; ctx.lineWidth = 2;
  ctx.strokeRect(zx, y - 1, zw, h + 2);
  ctx.restore();
  const lx = clamp(zx + zw / 2, x + 44, x + w - 44);
  text('ちょうどいい', lx, y - 16, 14, C.zoneD, 'center', '#ffffff', 4);
  // マーカー
  const mx = x + s.v / 100 * w;
  const P = mode === 'play' ? s.P : 0;
  const mc = P ? C.hot : C.coolD;
  ctx.fillStyle = mc;
  ctx.fillRect(mx - 2, y - 4, 4, h + 8);
  ctx.beginPath(); ctx.moveTo(mx - 9, y + h + 14); ctx.lineTo(mx + 9, y + h + 14); ctx.lineTo(mx, y + h + 4); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  text(st.lo, x, y + h + 26, 14, C.sub, 'left');
  text(st.hi, x + w, y + h + 26, 14, C.sub, 'right');
  if (st.readout) text('おゆ ' + st.readout(s), W / 2, y + h + 26, 16, C.ink, 'center', '#ffffff', 4);
}

}

function drawBubble(st, s) {
  if (!bubble) return;
  let hx;
  if (st.key === 'water') hx = 10 + 12;
  else if (st.key === 'bath') hx = 6 + 12;
  else hx = zundaWalkX(s) + 12;
  const headX = hx * PS, headY = SY + 52 * PS;
  const lines = wrap(bubble.text, 190, 17);
  const bw = Math.min(220, Math.max(...lines.map(l => { ctx.font = `17px ${FF}`; return ctx.measureText(l).width; })) + 26);
  const bh = lines.length * 24 + 16;
  const bx = clamp(headX - 30, 8, W - bw - 8);
  const by = headY - bh - 22;
  const a = Math.min(1, bubble.t * 8);
  ctx.save();
  ctx.globalAlpha = a;
  rr(bx, by, bw, bh, 14, '#ffffff', C.ink, 3);
  ctx.beginPath();
  ctx.moveTo(clamp(headX - 8, bx + 14, bx + bw - 30), by + bh - 2);
  ctx.lineTo(clamp(headX + 8, bx + 30, bx + bw - 14), by + bh - 2);
  ctx.lineTo(clamp(headX, bx + 18, bx + bw - 18), by + bh + 16);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillRect(clamp(headX - 6, bx + 16, bx + bw - 28), by + bh - 4, 13, 4);
  lines.forEach((l, i) => text(l, bx + bw / 2, by + 20 + i * 24, 17, C.ink));
  ctx.restore();
}

  rr(30, 418, W - 60, 92, 16, C.panel, C.ink, 3);
  text('ちょうどいい が わからないのだ。', W / 2, 442, 17, C.ink);
  text('おしてる あいだ 100、はなすと 0。', W / 2, 468, 15, C.sub);
  text('くりかえして ちょうどいい を まもるのだ！', W / 2, 490, 14, C.sub);
  if (blink()) text('タップ か スペースで はじめる', W / 2, 552, 20, C.hot, 'center', '#ffffff', 5);
  if (best > 0) text('ベスト ' + best, W / 2, 592, 16, C.sub);
}

function drawFinal() {
  drawBackdrop();
  drawMute();
  const total = results.total || 0;
  const rk = rankOf(total);
  text('けっか', W / 2, 52, 26, C.ink);
  rr(28, 80, W - 56, 168, 18, C.panel, C.ink, 3);
  STAGES.forEach((st, i) => {
    const r = results[i];
    text(st.name, 48, 108 + i * 34, 16, C.ink, 'left');
    text(r.clear ? 'クリア' : 'しっぱい', 236, 108 + i * 34, 14, r.clear ? C.zoneD : C.coolD, 'center');
    text(String(r.score), W - 48, 108 + i * 34, 18, C.ink, 'right');
  });
  ctx.fillStyle = '#d8dcc6'; ctx.fillRect(48, 206, W - 96, 2);
  text('ごうけい', 48, 228, 18, C.ink, 'left');
  text(String(total), W - 48, 228, 26, C.hot, 'right');

  text('ランク', W / 2, 282, 16, C.sub);
  text(rk.key, W / 2, 326, 70, rk.key === 'S' ? C.gold : C.zunda, 'center', C.ink, 10);
  text(rk.title, W / 2, 378, 22, C.ink, 'center', '#ffffff', 5);

  ctx.imageSmoothingEnabled = false;
  const face = rk.key === 'S' || rk.key === 'A' ? 'happy' : rk.key === 'D' ? 'sad' : 'normal';
  ctx.drawImage(zsp(face, 'stand'), 34, 452 + Math.round(Math.sin(globalT * 4) * 2), 72, 99);
  ctx.imageSmoothingEnabled = true;
  const lines = wrap(rk.line, 196, 16);
  const bh = lines.length * 22 + 18;
  rr(120, 470, 216, bh, 14, '#ffffff', C.ink, 3);
  lines.forEach((l, i) => text(l, 228, 470 + 20 + i * 22, 16, C.ink));
  if (results.isBest) text('ベスト こうしん！', W / 2, 420, 18, C.hot);
  else text('ベスト ' + best, W / 2, 420, 16, C.sub);
  if (blink()) text('タップで タイトルへ', W / 2, 600, 18, C.hot);
}

function drawLoading() {
  drawBackdrop();
  text('よみこみちゅう…', W / 2, H / 2, 20, C.ink);
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (mode === 'loading') drawLoading();
  else if (mode === 'title') drawTitle();
  else if (mode === 'intro') drawIntro();
  else if (mode === 'countdown') drawCountdown();
  else if (mode === 'play') drawPlay();
  else if (mode === 'stageEnd') drawStageEnd();
  else if (mode === 'final') drawFinal();
}

// ============================================================
//  ループ
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  updateAudio(STAGES[stageIdx], S);
  render();
  requestAnimationFrame(frame);
}

function start() {
  resize();
  const done = () => { fontReady = true; if (mode === 'loading') setMode('title'); };
  if (document.fonts && document.fonts.load) {
    Promise.race([
      document.fonts.load(`20px KabutoTegaki`, 'ずんだもん0123'),
      new Promise(r => setTimeout(r, 2500)),
    ]).then(done, done);
  } else done();
  requestAnimationFrame(frame);
}
start();
// デバッグ よう
window.__zerohyaku = { sc, AU, get mode() { return mode; }, get S() { return S; }, get results() { return results; }, setStage(i) { stageIdx = i; S = newStageState(); setMode('intro'); } };
})();
</script>
